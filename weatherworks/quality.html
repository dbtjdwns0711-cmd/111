<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기상데이터 품질관리 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <!-- 사이드바 (다른 탭과 100% 동일하게 자동 주입) -->
  <aside id="sidebar"></aside>

  <div class="main">
    <!-- 상단바 (다른 탭과 100% 동일하게 자동 주입) -->
    <header id="topbar"></header>

    <main id="page-content">
      <div class="page-head">
        <h2>기상데이터 품질관리</h2>
        <div class="desc">수집 데이터 이상치 검정 및 시간대별 품질 관리 내역입니다.</div>
      </div>

      <!-- 시간별 상태 요약 패널 -->
      <div class="panel">
        <div class="panel-head row space-between">
          <h3>시간별 상태 요약</h3>
          <span class="muted" style="font-size: 12px;" id="rateSummary">수집률 74.9% · 총 960개 시간대</span>
        </div>
        <div style="height: 12px; background: var(--line, #e2e8f0); border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 8px;">
          <div id="barNormal" style="background: #10b981; width: 74.9%; height: 100%;"></div>
          <div id="barCaution" style="background: #f59e0b; width: 0%; height: 100%;"></div>
          <div id="barError" style="background: #ef4444; width: 25.1%; height: 100%;"></div>
        </div>
        <div id="countsSummary" class="muted" style="font-size: 12px; text-align: right;">
          기온 11건 · 습도 11건 · 강수량 8건 · 풍속 13건
        </div>
      </div>

      <!-- 기상데이터 품질관리 내역 패널 -->
      <div class="panel">
        <div class="panel-head row space-between">
          <h3>기상데이터 품질관리 내역</h3>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>측정일시</th>
                <th>기온</th>
                <th>습도</th>
                <th>강수량</th>
                <th>풍속</th>
                <th>판정</th>
                <th>판정 이유</th>
              </tr>
            </thead>
            <tbody id="qualityTableBody">
              <tr>
                <td colspan="7" style="text-align: center; padding: 30px;" class="muted">데이터를 불러오는 중입니다...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  // 사이드바 및 상단바 자동 렌더링
  if (typeof renderSidebar === 'function') renderSidebar();
  if (typeof renderTopbar === 'function') renderTopbar('기상데이터 품질관리');

  try {
    const res = await fetch('data/quality-data.json');
    if (!res.ok) throw new Error('파일을 불러올 수 없습니다.');
    const rawJson = await res.json();

    let records = [];
    if (Array.isArray(rawJson)) {
      records = rawJson;
    } else if (rawJson.records && Array.isArray(rawJson.records)) {
      records = rawJson.records;
    } else if (rawJson.data && Array.isArray(rawJson.data)) {
      records = rawJson.data;
    }

    const tbody = document.getElementById('qualityTableBody');
    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;" class="muted">수집된 데이터가 없습니다.</td></tr>';
      return;
    }

    // 최신 데이터(9월 13일)부터 역순 정렬
    const reversedRecords = [...records].reverse();

    const rowsHtml = reversedRecords.map(rec => {
      // 측정일시 탐색
      let timeStr = rec.tm || rec.time || rec.datetime || rec.date || rec.timestamp || rec.dt || rec.hour;
      if (!timeStr) {
        for (const key of Object.keys(rec)) {
          if (typeof rec[key] === 'string' && (rec[key].includes('2026-') || rec[key].includes('2025-'))) {
            timeStr = rec[key];
            break;
          }
        }
      }
      if (!timeStr) timeStr = '-';

      // 4대 기상 요소
      const tempVal = rec.feelsLike !== undefined ? `${rec.feelsLike} °C` : (rec.temp !== undefined ? `${rec.temp} °C` : '-');
      const humidityVal = rec.humidity !== undefined ? `${rec.humidity} %` : '-';
      const rainVal = rec.rain1h !== undefined ? `${rec.rain1h} mm` : (rec.rain !== undefined ? `${rec.rain} mm` : '-');
      const windVal = rec.wind !== undefined ? `${rec.wind} m/s` : '-';

      const status = rec.status || '정상';
      const reason = rec.reason || '10년 같은 월 기준 범위 내';

      const badgeStyle = status === '정상' 
        ? 'background:#dcfce7; color:#15803d;' 
        : (status === '주의' ? 'background:#fef9c3; color:#a16207;' : 'background:#fee2e2; color:#b91c1c;');

      return `
        <tr>
          <td class="mono">${timeStr}</td>
          <td class="num mono"><strong>${tempVal}</strong></td>
          <td class="num mono">${humidityVal}</td>
          <td class="num mono">${rainVal}</td>
          <td class="num mono">${windVal}</td>
          <td><span class="badge" style="${badgeStyle}">${status}</span></td>
          <td class="muted">${reason}</td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml.slice(0, 100).join('');

  } catch (err) {
    console.error(err);
    document.getElementById('qualityTableBody').innerHTML = `
      <tr><td colspan="7" style="text-align:center; color:#ef4444; padding:30px;">데이터 로드 오류: ${err.message}</td></tr>
    `;
  }
});
</script>
</body>
</html>
