<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기상데이터 품질관리 - WeatherWorks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- 다른 탭과 동일한 원본 네비게이션 주입 구조 -->
    <div id="nav-placeholder"></div>

    <div class="content-area">
      <div class="top-bar">
        <h1 class="page-title">기상데이터 품질관리</h1>
        <div class="system-status">
          <span class="status-dot"></span>시스템 상태: <strong>정상 가동중</strong>
        </div>
      </div>

      <div class="main-content">
        <!-- 시간별 상태 요약 카드 -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div class="card-title" style="font-weight: 700; font-size: 15px;">시간별 상태 요약</div>
            <div id="rateSummary" style="font-size: 12px; color: #64748b;">수집률 74.9% · 총 960개 시간대</div>
          </div>
          <div class="progress-bar-bg" style="height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; display: flex;">
            <div id="barNormal" style="background: #10b981; width: 74.9%; height: 100%;"></div>
            <div id="barCaution" style="background: #f59e0b; width: 0%; height: 100%;"></div>
            <div id="barError" style="background: #ef4444; width: 25.1%; height: 100%;"></div>
          </div>
          <div id="countsSummary" style="font-size: 12px; color: #64748b; text-align: right; margin-top: 8px;">
            기온 11건 · 습도 11건 · 강수량 8건 · 풍속 13건
          </div>
        </div>

        <!-- 기상데이터 품질관리 내역 -->
        <div class="card">
          <div class="card-header" style="margin-bottom: 16px;">
            <div class="card-title" style="font-weight: 700; font-size: 15px;">기상데이터 품질관리 내역</div>
          </div>
          <div class="table-responsive">
            <table class="data-table" style="width: 100%; text-align: left; border-collapse: collapse;">
              <thead>
                <tr style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                  <th style="padding: 12px 14px;">측정일시</th>
                  <th style="padding: 12px 14px;">기온</th>
                  <th style="padding: 12px 14px;">습도</th>
                  <th style="padding: 12px 14px;">강수량</th>
                  <th style="padding: 12px 14px;">풍속</th>
                  <th style="padding: 12px 14px;">판정</th>
                  <th style="padding: 12px 14px;">판정 이유</th>
                </tr>
              </thead>
              <tbody id="qualityTableBody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 30px; color: #64748b;">데이터를 불러오는 중입니다...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('data/quality-data.json');
        if (!res.ok) throw new Error('파일을 찾을 수 없습니다.');
        const rawJson = await res.json();

        let records = [];
        // JSON 형태 대응: 배열 또는 records / data / items 프로퍼티
        if (Array.isArray(rawJson)) {
          records = rawJson;
        } else if (rawJson.records && Array.isArray(rawJson.records)) {
          records = rawJson.records;
        } else if (rawJson.data && Array.isArray(rawJson.data)) {
          records = rawJson.data;
        }

        const tbody = document.getElementById('qualityTableBody');
        if (!records || records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">수집된 데이터가 없습니다.</td></tr>';
          return;
        }

        // 최신 데이터(9월 13일)부터 출력되도록 역순 복사
        const reversedRecords = [...records].reverse();

        const rowsHtml = reversedRecords.map(rec => {
          // 측정일시 탐색 (가능한 모든 날짜/시간 키 매핑)
          let timeStr = rec.tm || rec.time || rec.datetime || rec.date || rec.timestamp || rec.dt || rec.hour;

          // 만약 객체 내부 키에 없다면 records 상위 객체의 타임스탬프 또는 ISO 형식 탐색
          if (!timeStr) {
            for (const key of Object.keys(rec)) {
              if (typeof rec[key] === 'string' && (rec[key].includes('2026-') || rec[key].includes('2025-'))) {
                timeStr = rec[key];
                break;
              }
            }
          }

          if (!timeStr) timeStr = '-';

          // 4대 기상 요소
          const tempVal = rec.feelsLike !== undefined ? `${rec.feelsLike} °C` : (rec.temp !== undefined ? `${rec.temp} °C` : '-');
          const humidityVal = rec.humidity !== undefined ? `${rec.humidity} %` : '-';
          const rainVal = rec.rain1h !== undefined ? `${rec.rain1h} mm` : (rec.rain !== undefined ? `${rec.rain} mm` : '-');
          const windVal = rec.wind !== undefined ? `${rec.wind} m/s` : '-';

          const status = rec.status || '정상';
          const reason = rec.reason || '10년 같은 월 기준 범위 내';

          const badgeColor = status === '정상' ? '#059669' : (status === '주의' ? '#d97706' : '#dc2626');
          const badgeBg = status === '정상' ? '#e6f9f0' : (status === '주의' ? '#fef3c7' : '#fee2e2');

          return `
            <tr style="border-bottom: 1px solid #f1f5f9;">
              <td style="padding: 12px 14px; font-weight: 500;">${timeStr}</td>
              <td style="padding: 12px 14px; font-weight: 600;">${tempVal}</td>
              <td style="padding: 12px 14px;">${humidityVal}</td>
              <td style="padding: 12px 14px;">${rainVal}</td>
              <td style="padding: 12px 14px;">${windVal}</td>
              <td style="padding: 12px 14px;">
                <span style="display:inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; color: ${badgeColor}; background: ${badgeBg};">
                  ${status}
                </span>
              </td>
              <td style="padding: 12px 14px; color: #64748b;">${reason}</td>
            </tr>
          `;
        });

        // 최신순 상위 100건 렌더링
        tbody.innerHTML = rowsHtml.slice(0, 100).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('qualityTableBody').innerHTML = `
          <tr><td colspan="7" style="text-align:center; color:#ef4444; padding:30px;">데이터 로드 오류: ${err.message}</td></tr>
        `;
      }
    });
  </script>
</body>
</html>
