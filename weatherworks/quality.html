<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기상데이터 품질관리 · WeatherWorks</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .quality-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px 20px;
    }
    .summary-card .label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .summary-card .value {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }
    .summary-card .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .ratio-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
      display: flex;
    }
    .ratio-bar .segment {
      height: 100%;
    }
    .badge-normal { background: #dcfce7; color: #15803d; }
    .badge-suspect { background: #fef9c3; color: #a16207; }
    .badge-error { background: #fee2e2; color: #b91c1c; }
    .badge-missing { background: #f1f5f9; color: #64748b; }
    .table-container {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th, .data-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
    }
    .data-table th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    .data-table tr:hover {
      background: #f8fafc;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .num-val {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="nav-placeholder"></div>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>기상데이터 품질관리</h2>
          <p class="subtitle">수집 데이터 이상치 검정 및 결측치 관리 내역</p>
        </div>
        <div class="header-actions">
          <span class="status-indicator active"></span>
          <span style="font-size: 13px; color: #475569;">실시간 검정 가동 중</span>
        </div>
      </div>

      <!-- 요약 통계 카드 (기존 유지) -->
      <div class="quality-summary">
        <div class="summary-card">
          <div class="label">총 검정 건수</div>
          <div class="value" id="totalChecks">-</div>
          <div class="sub" id="totalPeriod">-</div>
        </div>
        <div class="summary-card">
          <div class="label">정상 데이터율</div>
          <div class="value" id="normalRate" style="color: #15803d;">-%</div>
          <div class="ratio-bar">
            <div id="barNormal" class="segment" style="background: #22c55e; width: 0%;"></div>
            <div id="barSuspect" class="segment" style="background: #eab308; width: 0%;"></div>
            <div id="barError" class="segment" style="background: #ef4444; width: 0%;"></div>
          </div>
        </div>
        <div class="summary-card">
          <div class="label">의심/주의 건수</div>
          <div class="value" id="suspectCount" style="color: #a16207;">-</div>
          <div class="sub">임계치 경계값 검출</div>
        </div>
        <div class="summary-card">
          <div class="label">이상/결측 건수</div>
          <div class="value" id="errorCount" style="color: #b91c1c;">-</div>
          <div class="sub">보정 및 제외 대상</div>
        </div>
      </div>

      <!-- 품질관리 세부 내역 테이블 (기존 유지) -->
      <div class="table-container">
        <div class="table-header">
          <h3>기상데이터 품질관리 내역</h3>
          <span style="font-size: 13px; color: #64748b;" id="tableCountSummary"></span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>측정일시</th>
              <th>항목</th>
              <th>실제값</th>
              <th>1백분위수</th>
              <th>99백분위수</th>
              <th>판정</th>
              <th>판정 이유</th>
            </tr>
          </thead>
          <tbody id="qualityTableBody">
            <tr>
              <td colspan="7" style="text-align: center; color: #94a3b8; padding: 32px;">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('data/quality-data.json');
        if (!res.ok) throw new Error('데이터 파일을 불러올 수 없습니다.');
        const rawData = await res.json();

        const records = Array.isArray(rawData) ? rawData : (rawData.records || rawData.data || []);
        const tbody = document.getElementById('qualityTableBody');

        if (!records || records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 32px;">검정 내역이 없습니다.</td></tr>';
          return;
        }

        // 각 시간대별 기상 4개 요소 정의
        const ELEMENT_MAP = [
          { name: '기온', key: 'feelsLike', unit: '°C' },
          { name: '습도', key: 'humidity', unit: '%' },
          { name: '강수량', key: 'rain1h', unit: 'mm' },
          { name: '풍속', key: 'wind', unit: 'm/s' }
        ];

        const rows = [];
        let totalChecks = 0;
        let normalCount = 0;
        let suspectCount = 0;
        let errorCount = 0;

        records.forEach(rec => {
          const dt = rec.datetime || rec.time || rec.date || '-';
          const bounds = rec.bounds || {};

          ELEMENT_MAP.forEach(elem => {
            totalChecks++;
            const val = rec[elem.key];
            const bound = bounds[elem.name] || {};
            const p01 = bound.p01 !== undefined ? bound.p01 : '-';
            const p99 = bound.p99 !== undefined ? bound.p99 : '-';

            // 판정 상태 확인
            let status = rec.status || '정상';
            let reason = rec.reason || '10년 같은 월 기준 범위 내';

            // 개별 기준 범위(bounds) 초과 여부 확인
            if (val !== undefined && p01 !== '-' && p99 !== '-') {
              if (val < p01 || val > p99) {
                status = '주의';
                reason = `기준치 초과 (${p01} ~ ${p99})`;
              }
            }

            // 배지 클래스 매핑
            let badgeClass = 'badge-normal';
            if (status === '정상') {
              normalCount++;
            } else if (status === '주의' || status === '의심') {
              badgeClass = 'badge-suspect';
              suspectCount++;
            } else {
              badgeClass = 'badge-error';
              errorCount++;
            }

            rows.push(`
              <tr>
                <td>${dt}</td>
                <td><strong>${elem.name}</strong></td>
                <td class="num-val">${val !== undefined ? `${val} ${elem.unit}` : '-'}</td>
                <td class="num-val">${p01}</td>
                <td class="num-val">${p99}</td>
                <td><span class="badge ${badgeClass}">${status}</span></td>
                <td>${reason}</td>
              </tr>
            `);
          });
        });

        // 1. 테이블 채우기 (렌더링 최적화를 위해 상위 100건 표시)
        const displayLimit = 100;
        tbody.innerHTML = rows.slice(0, displayLimit).join('');

        // 2. 상단 원본 통계 카드 업데이트
        document.getElementById('totalChecks').textContent = totalChecks.toLocaleString() + '건';
        document.getElementById('totalPeriod').textContent = `최근 ${records.length}개 시간대 관측`;

        const normalRate = ((normalCount / totalChecks) * 100).toFixed(1);
        document.getElementById('normalRate').textContent = normalRate + '%';
        document.getElementById('barNormal').style.width = normalRate + '%';
        document.getElementById('barSuspect').style.width = ((suspectCount / totalChecks) * 100).toFixed(1) + '%';
        document.getElementById('barError').style.width = ((errorCount / totalChecks) * 100).toFixed(1) + '%';

        document.getElementById('suspectCount').textContent = suspectCount.toLocaleString() + '건';
        document.getElementById('errorCount').textContent = errorCount.toLocaleString() + '건';

        document.getElementById('tableCountSummary').textContent = `총 ${totalChecks.toLocaleString()}건 중 최근 ${Math.min(displayLimit, totalChecks)}건 표시`;

      } catch (err) {
        console.error(err);
        document.getElementById('qualityTableBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444; padding: 32px;">데이터 로드 실패: ${err.message}</td></tr>`;
      }
    });
  </script>
</body>
</html>
