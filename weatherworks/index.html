<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 관리 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .project-card { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .project-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .project-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .project-name { font-size: 16px; font-weight: 700; color: #1e293b; }
  .project-meta { font-size: 12.5px; color: #64748b; line-height: 1.6; margin-bottom: 16px; }
  
  /* 간트차트 시각화 영역 */
  .gantt-wrap { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .gantt-header-row { display: flex; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 12px; font-weight: 700; color: #64748b; }
  .gantt-item-row { display: flex; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 12px 0; font-size: 13px; }
  .gantt-item-label { width: 220px; flex-shrink: 0; font-weight: 600; color: #1e293b; }
  .gantt-item-timeline { flex: 1; position: relative; height: 24px; background: #f8fafc; border-radius: 4px; overflow: hidden; }
  .gantt-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; color: #fff; font-size: 11px; font-weight: 600; }
  
  /* 모달 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-dialog { background: #fff; border-radius: 8px; width: 520px; max-width: 90vw; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app-shell">
  <!-- 사이드바 -->
  <aside id="sidebar"></aside>

  <div class="main">
    <!-- 상단바 -->
    <header id="topbar"></header>

    <main id="page-content">
      <div class="page-head row space-between">
        <div>
          <h2>현장 관리 (Projects)</h2>
          <div class="desc">등록된 건설 프로젝트별 공기 산정 현황, 매핑 관측소 및 전체 공정 타임라인(Gantt)을 통합 관리합니다.</div>
        </div>
        <div>
          <button class="btn btn-primary" onclick="openNewProjectModal()">+ 신규 현장 등록</button>
        </div>
      </div>

      <!-- 현장 프로젝트 카드 리스트 -->
      <div class="project-grid" id="project-list-container">
        <!-- JS 동적 렌더링 -->
      </div>

      <!-- 종합 공정 간트차트 시각화 패널 -->
      <div class="gantt-wrap">
        <div class="row space-between items-center" style="margin-bottom: 16px;">
          <div>
            <h3 style="margin: 0; font-size: 15px; color: #1e293b;">현장별 주요 공정 간트차트 (Timeline)</h3>
            <span class="muted" style="font-size: 12px;">공사 물량·생산성 산정에서 등록된 공정 작업일수가 자동으로 반영됩니다.</span>
          </div>
          <div class="row gap-8">
            <select id="sel-gantt-project" class="input" style="width: 220px; font-size: 13px;" onchange="renderGanttChart(this.value)"></select>
          </div>
        </div>

        <div class="gantt-header-row">
          <div style="width: 220px;">공종 및 품목명</div>
          <div style="flex: 1; text-align: center;">공정 타임라인 및 예상 산정 소요 기간</div>
          <div style="width: 100px; text-align: right;">산정 공기</div>
        </div>

        <div id="gantt-body">
          <!-- JS 동적 렌더링 -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 신규 현장 등록 모달 -->
<div class="modal-backdrop" id="modal-project">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 style="margin:0; font-size:15px;">신규 현장 추가</h3>
      <button onclick="closeModal()" style="border:none; background:none; font-size:18px; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">공사 현장명</label>
        <input type="text" id="m-inp-name" class="input" style="width:100%; margin-top:4px;" placeholder="예: OO지구 관로 매설 및 도로개설공사">
      </div>
      <div class="row gap-12">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 착공일</label>
          <input type="date" id="m-inp-start" class="input" style="width:100%; margin-top:4px;">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 준공예정일</label>
          <input type="date" id="m-inp-end" class="input" style="width:100%; margin-top:4px;">
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">연계 기상관측지점</label>
        <select id="m-sel-station" class="input" style="width:100%; margin-top:4px;">
          <option value="133 대전(ASOS)">133 대전(ASOS) - 대전 덕명동 인접</option>
          <option value="637 아산배방(AWS)">637 아산배방(AWS) - 아산 배방읍 인접</option>
          <option value="232 천안(ASOS)">232 천안(ASOS) - 천안 신부동 인접</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">현장 설명 / 특이사항</label>
        <textarea id="m-inp-desc" class="input" style="width:100%; height:70px; margin-top:4px; font-size:13px;" placeholder="지하매설물 간섭 구간, 기상 민감 공종 등"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">취소</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewProject()">현장 등록</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (typeof renderSidebar === 'function') renderSidebar();
  if (typeof renderTopbar === 'function') renderTopbar('현장 관리');

  ensureDefaultProjects();
  renderProjectCards();
  initGanttProjectSelector();
});

function ensureDefaultProjects() {
  const db = loadDB();
  if (!db.projects || db.projects.length === 0) {
    db.projects = [
      {
        id: "P_001",
        name: "OO지구 공동주택 신축공사",
        station: "133 대전(ASOS)",
        start: "2026-03-01",
        end: "2027-02-28",
        desc: "토공사 및 철근콘크리트 구조물 공사 집중 구간",
        status: "진행중"
      },
      {
        id: "P_002",
        name: "아산 배방 도시계획도로 개설공사",
        station: "637 아산배방(AWS)",
        start: "2026-05-10",
        end: "2026-11-30",
        desc: "지하 관로 매설 및 아스콘 포장 공사",
        status: "진행중"
      }
    ];
    saveDB(db);
  }
}

function renderProjectCards() {
  const db = loadDB();
  const container = document.getElementById('project-list-container');
  const projects = db.projects || [];
  const quantities = db.quantities || [];

  if (!projects.length) {
    container.innerHTML = '<div class="panel" style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">등록된 공사 현장이 없습니다. 신규 현장을 등록하세요.</div>';
    return;
  }

  container.innerHTML = projects.map(p => {
    const pQuants = quantities.filter(q => q.projectId === p.id);
    const totalDays = pQuants.reduce((acc, cur) => acc + (cur.workDays || 0), 0);

    return `
      <div class="project-card">
        <div>
          <div class="project-card-head">
            <div class="project-name">${p.name}</div>
            <span class="badge" style="background:#ecfdf5; color:#16a34a; font-weight:600;">${p.status || '공사중'}</span>
          </div>
          <div class="project-meta">
            • 공사 기간: <strong>${p.start} ~ ${p.end}</strong><br>
            • 기상 관측소: <strong>${p.station || '대전 133번'}</strong><br>
            • 등록 물량 공종: <strong>${pQuants.length}건</strong> (순 작업일수 합계: <strong>${totalDays}일</strong>)<br>
            • 비고: ${p.desc || '특이사항 없음'}
          </div>
        </div>
        <div class="row gap-8" style="margin-top:12px;">
          <a href="quantity.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">물량 산정</a>
          <a href="schedule.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">공정표</a>
          <button class="btn btn-sm" style="color:#ef4444; border-color:#fca5a5;" onclick="deleteProject('${p.id}')">삭제</button>
        </div>
      </div>
    `;
  }).join('');
}

function initGanttProjectSelector() {
  const db = loadDB();
  const sel = document.getElementById('sel-gantt-project');
  const projects = db.projects || [];

  sel.innerHTML = projects.map((p, idx) => `
    <option value="${p.id}" ${idx === 0 ? 'selected' : ''}>${p.name}</option>
  `).join('');

  if (projects.length) {
    renderGanttChart(sel.value);
  }
}

function renderGanttChart(projectId) {
  const db = loadDB();
  const body = document.getElementById('gantt-body');
  const quants = (db.quantities || []).filter(q => q.projectId === projectId);

  if (!quants.length) {
    body.innerHTML = `
      <div style="text-align:center; padding:30px; color:#94a3b8; font-size:13px;">
        현재 선택된 현장에 등록된 공사 물량(품종)이 없습니다.<br>
        [공사 물량·생산성 산정] 메뉴에서 물량을 추가하면 타임라인이 자동으로 구성됩니다.
      </div>
    `;
    return;
  }

  const colors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2'];
  let currentOffset = 5;

  body.innerHTML = quants.map((q, idx) => {
    const widthPct = Math.min(Math.max(q.workDays * 3.5, 12), 45);
    const leftPct = currentOffset;
    currentOffset = (currentOffset + widthPct + 3) % 75;
    const color = colors[idx % colors.length];

    return `
      <div class="gantt-item-row">
        <div class="gantt-item-label">
          <span class="badge" style="background:#f1f5f9; color:#475569; font-size:11px; margin-right:4px;">${q.category || '공종'}</span>
          ${q.name}
        </div>
        <div class="gantt-item-timeline">
          <div class="gantt-bar" style="left:${leftPct}%; width:${widthPct}%; background:${color};">
            ${q.name} (${q.workDays}일)
          </div>
        </div>
        <div style="width: 100px; text-align: right; font-weight: 700; color: #1e293b;" class="mono">
          ${q.workDays} 일
        </div>
      </div>
    `;
  }).join('');
}

function openNewProjectModal() {
  document.getElementById('m-inp-name').value = '';
  document.getElementById('m-inp-start').value = '2026-09-01';
  document.getElementById('m-inp-end').value = '2027-08-31';
  document.getElementById('m-inp-desc').value = '';
  document.getElementById('modal-project').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-project').style.display = 'none';
}

function saveNewProject() {
  const name = document.getElementById('m-inp-name').value.trim();
  const start = document.getElementById('m-inp-start').value;
  const end = document.getElementById('m-inp-end').value;
  const station = document.getElementById('m-sel-station').value;
  const desc = document.getElementById('m-inp-desc').value.trim();

  if (!name) {
    alert('공사 현장명을 입력해 주세요.');
    return;
  }

  const db = loadDB();
  const newProject = {
    id: 'P_' + Date.now(),
    name: name,
    start: start,
    end: end,
    station: station,
    desc: desc,
    status: '진행중'
  };

  if (!db.projects) db.projects = [];
  db.projects.push(newProject);
  saveDB(db);

  closeModal();
  renderProjectCards();
  initGanttProjectSelector();
  alert(`신규 현장 '${name}'이 등록되었습니다.`);
}

function deleteProject(pid) {
  if (!confirm('현장을 삭제하시겠습니까? 등록된 물량 내역도 함께 삭제될 수 있습니다.')) return;
  const db = loadDB();
  db.projects = (db.projects || []).filter(p => p.id !== pid);
  db.quantities = (db.quantities || []).filter(q => q.projectId !== pid);
  saveDB(db);

  renderProjectCards();
  initGanttProjectSelector();
}
</script>
</body>
</html>
