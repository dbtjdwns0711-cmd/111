<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구간별 관측지점 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head">
        <h2>공사 구간별 관측지점 매핑</h2>
        <div class="desc">전국 4,418개 행정구역(읍·면·동) 기반 최인접 기상관측소 매핑 정보 및 직선거리를 조회합니다.</div>
      </div>

      <div class="panel">
        <div class="panel-head row space-between">
          <h3>기상관측소 매핑 현황</h3>
          <span class="muted" style="font-size:12px;" id="station-count">총 4,418개 구간 매핑</span>
        </div>
        <div class="row gap-8" style="margin-bottom:14px;">
          <input type="text" id="station-search" class="input" style="max-width:320px;" placeholder="현장 주소(시군구, 읍·면·동) 또는 관측지점명 검색...">
        </div>
        <div class="table-wrap" style="max-height:600px; overflow-y:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>현장 위치 (행정구역 주소)</th>
                <th>매핑 지점코드</th>
                <th>매핑 관측지점명</th>
                <th>관측소 실제 주소</th>
                <th>직선거리(km)</th>
                <th>데이터 신뢰도</th>
              </tr>
            </thead>
            <tbody id="tbl-stations"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/stations-data.js"></script>
<script src="js/nav.js"></script>
<script>
// 1. 사이드바 및 상단바 렌더링
renderSidebar();
renderTopbar('구간별 관측지점');

// 2. 관측소 테이블 렌더링 및 검색 로직
(function() {
  const data = (typeof STATIONS_DATA !== 'undefined') ? STATIONS_DATA : [];
  const tbody = document.getElementById('tbl-stations');
  const countEl = document.getElementById('station-count');
  const searchInput = document.getElementById('station-search');

  function renderList(list) {
    if (countEl) countEl.textContent = `총 ${list.length.toLocaleString()}개 구간 매핑`;
    const slice = list.slice(0, 100); // 초기 100건 고속 렌더링
    tbody.innerHTML = slice.map(s => {
      const dist = typeof s.dist === 'number' ? s.dist.toFixed(2) : (s.dist || '-');
      let badge = '<span class="badge" style="background:#ecfdf5;color:#065f46;">최적 (5km 이내)</span>';
      if (s.dist > 10) badge = '<span class="badge" style="background:#fef2f2;color:#991b1b;">주의 (10km 초과)</span>';
      else if (s.dist > 5) badge = '<span class="badge" style="background:#fffbeb;color:#b45309;">보통 (10km 이내)</span>';

      return `
        <tr>
          <td>${s.address || s.admName || '-'}</td>
          <td>${s.stnId || s.code || '-'}</td>
          <td><strong>${s.stnName || s.name || '-'}</strong></td>
          <td>${s.stnAddress || s.realAddress || '-'}</td>
          <td>${dist} km</td>
          <td>${badge}</td>
        </tr>
      `;
    }).join('');
  }

  renderList(data);

  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderList(data);
        return;
      }
      const filtered = data.filter(s => 
        (s.address && s.address.toLowerCase().includes(q)) ||
        (s.admName && s.admName.toLowerCase().includes(q)) ||
        (s.stnName && s.stnName.toLowerCase().includes(q))
      );
      renderList(filtered);
    });
  }
})();
</script>
</body>
</html>
