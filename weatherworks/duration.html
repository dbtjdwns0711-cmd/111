<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공사기간 산정 총괄 · WeatherWorks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- 좌측 사이드바 (nav.js가 탐색하는 .sidebar 클래스) -->
    <aside class="sidebar"></aside>

    <!-- 우측 메인 영역 -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <span class="top-bar-title">공사기간 산정 총괄</span>
        </div>
        <div class="top-bar-right" id="topbar-right">
          <!-- nav.js 또는 수동 셀렉터 -->
          <select class="form-select project-selector" id="projectSelector">
            <option>OO지구 공동주택 신축공사</option>
          </select>
        </div>
      </header>

      <div class="content-container">
        <div class="page-title-area">
          <h2 class="page-title">공사기간 산정 · 총괄</h2>
          <p class="page-desc">작업일수 산정과 비작업일수 산정 결과를 합산해 예상 소요기간을 계산합니다.</p>
        </div>

        <div class="grid grid-4" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
          <div class="card stat-card"><div class="label" style="font-size: 12px; color: #64748b;">계약 공기</div><div class="value" id="v-contract" style="font-size: 20px; font-weight: 700; margin-top: 6px;">-</div></div>
          <div class="card stat-card"><div class="label" style="font-size: 12px; color: #64748b;">필요 작업일수</div><div class="value" id="v-workdays" style="font-size: 20px; font-weight: 700; margin-top: 6px;">-</div></div>
          <div class="card stat-card"><div class="label" style="font-size: 12px; color: #64748b;">예상 비작업일수</div><div class="value" id="v-nonworking" style="font-size: 20px; font-weight: 700; margin-top: 6px;">-</div></div>
          <div class="card stat-card"><div class="label" style="font-size: 12px; color: #64748b;">예상 소요 공기</div><div class="value" id="v-estimated" style="font-size: 20px; font-weight: 700; margin-top: 6px;">-</div></div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header"><h3 class="card-title">Timeline</h3></div>
          <div class="card-body">
            <div id="timeline"></div>
            <div class="row gap-12" style="display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: #475569;">
              <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #2563eb; border-radius: 2px; display: inline-block;"></span>계약 공기</span>
              <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; background: #f59e0b; border-radius: 2px; display: inline-block;"></span>산정 소요기간</span>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
          <div class="card-header"><h3 class="card-title">판정</h3></div>
          <div class="card-body">
            <div id="verdict"></div>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 12px;">
          <a class="btn" href="duration-workdays.html" style="text-decoration: none; padding: 8px 14px; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; color: #334155;">작업일수 산정 상세 →</a>
          <a class="btn" href="duration-weather.html" style="text-decoration: none; padding: 8px 14px; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; color: #334155;">비작업일수 산정 상세 →</a>
          <a class="btn btn-primary" href="index.html" style="text-decoration: none; padding: 8px 14px; background: #2563eb; color: #fff; border-radius: 4px; font-size: 13px;">기상 산정근거 검토 →</a>
        </div>
      </div>
    </main>
  </div>

  <!-- 스크립트 순서 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/util.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/sw-catalog.js"></script>
  <script src="js/nav.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof loadDB !== 'function') return;
    const db = loadDB();
    const pid = (typeof getCurrentProjectId === 'function') ? getCurrentProjectId(db) : (db.projects && db.projects[0] ? db.projects[0].id : null);
    const p = db.projects ? db.projects.find(x => x.id === pid) : null;
    if (!p) return;

    const list = (db.quantities || []).filter(q => q.projectId === pid);
    const requiredWorkDays = list.reduce((s, q) => s + (q.dailyOutput ? Math.ceil(q.quantity / q.dailyOutput) : 0), 0);
    const est = (typeof estimateDuration === 'function') ? estimateDuration(p, db, requiredWorkDays || undefined) : { requiredWorkDays: 0, nonWorkingDays: 0, estimatedCalendarDays: 0 };

    const contractDays = p.contractDays || (typeof daysBetween === 'function' ? daysBetween(p.startDate, p.endDate) : 0);
    
    document.getElementById('v-contract').innerHTML = contractDays + '<small style="font-size: 12px; font-weight: normal;"> 일</small>';
    document.getElementById('v-workdays').innerHTML = est.requiredWorkDays + '<small style="font-size: 12px; font-weight: normal;"> 일</small>';
    document.getElementById('v-nonworking').innerHTML = est.nonWorkingDays + '<small style="font-size: 12px; font-weight: normal;"> 일</small>';
    document.getElementById('v-estimated').innerHTML = est.estimatedCalendarDays + '<small style="font-size: 12px; font-weight: normal;"> 일</small>';

    const max = Math.max(contractDays, est.estimatedCalendarDays, 1);
    document.getElementById('timeline').innerHTML = `
      <div style="margin-bottom: 10px;">
        <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">계약 공기 (${contractDays}일)</div>
        <div style="background: #f1f5f9; border-radius: 4px; height: 18px; width: 100%;">
          <div style="width: ${Math.min(100, (contractDays / max) * 100)}%; background: #2563eb; height: 18px; border-radius: 4px;"></div>
        </div>
      </div>
      <div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">산정 소요기간 (${est.estimatedCalendarDays}일)</div>
        <div style="background: #f1f5f9; border-radius: 4px; height: 18px; width: 100%;">
          <div style="width: ${Math.min(100, (est.estimatedCalendarDays / max) * 100)}%; background: #f59e0b; height: 18px; border-radius: 4px;"></div>
        </div>
      </div>`;

    const diff = contractDays - est.estimatedCalendarDays;
    document.getElementById('verdict').innerHTML = diff >= 0
      ? `<div style="padding: 12px 16px; border-radius: 6px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; font-size: 13px;">산정 소요기간이 계약 공기 이내입니다 (여유 ${diff}일).</div>`
      : `<div style="padding: 12px 16px; border-radius: 6px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 13px;">산정 소요기간이 계약 공기를 ${Math.abs(diff)}일 초과합니다. 공기 연장 검토 또는 비작업일수 저감 방안이 필요합니다.</div>`;
  });
  </script>
</body>
</html>
